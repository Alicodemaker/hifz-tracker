name: CI

# Runs on every pull request so problems show up before merging to main.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # Typechecks (tsc -b) and builds with the same base path the Pages deploy uses.
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
